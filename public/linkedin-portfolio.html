<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <title>Sahir Sood Portfolio</title>
    <meta
      name="description"
      content="LinkedIn-tracked entry point for Sahir Sood's software developer portfolio."
    />
    <link rel="canonical" href="https://sahirsood.com/linkedin-portfolio.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sahir Sood" />
    <meta property="og:title" content="Sahir Sood Portfolio" />
    <meta
      property="og:description"
      content="Visit Sahir Sood's software developer portfolio."
    />
    <meta property="og:url" content="https://sahirsood.com/linkedin-portfolio.html" />
    <meta property="og:image" content="https://sahirsood.com/img/sahir-sood-professional-headshot-social.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#4285f4" />
    <script>
      (function () {
        var target = "https://sahirsood.com/about/linkedin";
        var payload = {
          event_type: "pageview",
          path: "/linkedin-portfolio.html",
          url: window.location.href,
          title: document.title,
          referrer: document.referrer || null,
          utm_source: "linkedin",
          utm_medium: "profile",
          utm_campaign: "portfolio_profile",
          session_id: sessionId(),
          metadata: { site: "portfolio", entry: "linkedin-featured" },
        };
        var body = JSON.stringify(payload);
        if (navigator.sendBeacon) {
          navigator.sendBeacon("/portfolio-analytics/event", new Blob([body], { type: "text/plain" }));
        } else {
          fetch("/portfolio-analytics/event", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: body,
            keepalive: true,
          }).catch(function () {});
        }
        window.setTimeout(function () {
          window.location.replace(target);
        }, 160);

        function sessionId() {
          var key = "portfolioAnalyticsSessionId";
          try {
            var existing = window.sessionStorage.getItem(key);
            if (existing) return existing;
            var next =
              (window.crypto && window.crypto.randomUUID && window.crypto.randomUUID()) ||
              Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
            window.sessionStorage.setItem(key, next);
            return next;
          } catch (error) {
            return null;
          }
        }
      })();
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #202124;
        background: #ffffff;
      }
      main {
        width: min(92vw, 520px);
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 2rem;
        line-height: 1.15;
      }
      p {
        color: #5f6368;
        line-height: 1.7;
      }
      a {
        color: #1a73e8;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sahir Sood Portfolio</h1>
      <p>Opening the portfolio.</p>
      <p><a href="https://sahirsood.com/about/linkedin">Continue to the About page</a></p>
    </main>
  </body>
</html>
